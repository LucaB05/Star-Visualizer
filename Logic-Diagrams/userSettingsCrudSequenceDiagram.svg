<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2100" viewBox="0 0 2200 2100">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f9e44"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b94a48"/>
    </marker>
    <style>
      .title { font: 700 46px Arial, sans-serif; fill: #111111; }
      .head { font: 700 22px Arial, sans-serif; fill: #13213b; }
      .label { font: 21px Arial, sans-serif; fill: #111111; }
      .small { font: 19px Arial, sans-serif; fill: #111111; }
      .altText { font: 700 22px Arial, sans-serif; fill: #13213b; }
      .box { fill: #ffffff; stroke: #13213b; stroke-width: 3; }
      .altBox { fill: none; stroke: #13213b; stroke-width: 3; }
      .note { fill: #fffdf2; stroke: #13213b; stroke-width: 2; }
      .life { stroke: #13213b; stroke-width: 3; stroke-dasharray: 16 13; }
      .active { fill: #eef4fb; stroke: #13213b; stroke-width: 1.5; }
      .line { stroke: #111111; stroke-width: 3; marker-end: url(#arrow); }
      .return { stroke: #111111; stroke-width: 2.5; stroke-dasharray: 12 8; marker-end: url(#arrow); }
      .greenLine { stroke: #2f9e44; stroke-width: 2.5; stroke-dasharray: 12 8; marker-end: url(#arrowGreen); }
      .redLine { stroke: #b94a48; stroke-width: 2.5; stroke-dasharray: 12 8; marker-end: url(#arrowRed); }
      .divider { stroke: #6c757d; stroke-width: 2; }
      .bg { fill: #ffffff; }
    </style>
  </defs>

  <rect width="2200" height="2100" fill="#ffffff"/>
  <text x="1100" y="62" text-anchor="middle" class="title">User Settings CRUD Flow</text>

  <!-- Participants -->
  <rect x="80" y="100" width="220" height="68" class="box"/>
  <text x="190" y="142" text-anchor="middle" class="head">Admin</text>

  <rect x="410" y="100" width="240" height="68" class="box"/>
  <text x="530" y="142" text-anchor="middle" class="head">AdminView</text>

  <rect x="770" y="100" width="290" height="68" class="box"/>
  <text x="915" y="142" text-anchor="middle" class="head">AdminController</text>

  <rect x="1200" y="100" width="250" height="68" class="box"/>
  <text x="1325" y="142" text-anchor="middle" class="head">UserDatabase</text>

  <rect x="1660" y="100" width="290" height="68" class="box"/>
  <text x="1805" y="130" text-anchor="middle" class="head">SQLite users</text>
  <text x="1805" y="156" text-anchor="middle" class="head">table</text>

  <line x1="190" y1="168" x2="190" y2="2040" class="life"/>
  <line x1="530" y1="168" x2="530" y2="2040" class="life"/>
  <line x1="915" y1="168" x2="915" y2="2040" class="life"/>
  <line x1="1325" y1="168" x2="1325" y2="2040" class="life"/>
  <line x1="1805" y1="168" x2="1805" y2="2040" class="life"/>

  <!-- Starting point -->
  <rect x="90" y="205" width="2020" height="82" class="note"/>
  <text x="120" y="240" class="altText">Starting point</text>
  <text x="120" y="266" class="small">Admin is already on the User Settings page. The list-loading flow is shown in the separate admin loading diagram.</text>

  <!-- Save block -->
  <rect x="90" y="330" width="2020" height="500" class="altBox"/>
  <rect x="90" y="330" width="95" height="40" class="box"/>
  <text x="137" y="357" text-anchor="middle" class="altText">alt</text>
  <text x="210" y="357" class="altText">Save existing user</text>

  <rect x="522" y="410" width="16" height="285" class="active"/>
  <rect x="907" y="455" width="16" height="275" class="active"/>
  <rect x="1317" y="565" width="16" height="120" class="active"/>
  <rect x="1797" y="610" width="16" height="50" class="active"/>

  <text x="295" y="405" text-anchor="middle" class="label">1. Clicks Save User</text>
  <line x1="190" y1="425" x2="530" y2="425" class="line"/>

  <text x="722" y="450" text-anchor="middle" class="label">2. saveUserRequested(user, passwordConfirmation)</text>
  <line x1="530" y1="470" x2="915" y2="470" class="line"/>

  <text x="1125" y="515" text-anchor="middle" class="label">3. Validate selected user and form fields</text>
  <path d="M 915 525 L 1015 525 L 1015 565 L 915 565" fill="none" class="line"/>

  <text x="1120" y="575" text-anchor="middle" class="label">4. editUser(user)</text>
  <line x1="915" y1="595" x2="1325" y2="595" class="line"/>

  <text x="1565" y="620" text-anchor="middle" class="label">5. UPDATE users WHERE id = user.id</text>
  <line x1="1325" y1="640" x2="1805" y2="640" class="line"/>

  <line x1="90" y1="700" x2="2110" y2="700" class="divider"/>
  <rect x="120" y="684" width="340" height="27" class="bg"/>
  <text x="290" y="704" text-anchor="middle" class="small" fill="#6c757d">if validation or database update fails</text>
  <text x="720" y="735" text-anchor="middle" class="label" fill="#b94a48">6a. showUserMessage(error, red)</text>
  <line x1="915" y1="755" x2="530" y2="755" class="redLine"/>

  <line x1="90" y1="785" x2="2110" y2="785" class="divider"/>
  <rect x="120" y="769" width="160" height="27" class="bg"/>
  <text x="200" y="789" text-anchor="middle" class="small" fill="#6c757d">if save succeeds</text>
  <text x="1120" y="825" text-anchor="middle" class="label" fill="#2f9e44">6b. reload users, refresh selected user, show green success message</text>
  <line x1="1325" y1="845" x2="915" y2="845" class="greenLine"/>
  <line x1="915" y1="880" x2="1325" y2="880" class="line"/>
  <text x="1120" y="875" text-anchor="middle" class="label">7b. getAllUsers()</text>
  <line x1="915" y1="920" x2="530" y2="920" class="greenLine"/>
  <text x="722" y="915" text-anchor="middle" class="label" fill="#2f9e44">8b. displayUsers + displaySelectedUser</text>

  <!-- Delete block -->
  <rect x="90" y="900" width="2020" height="430" class="altBox"/>
  <rect x="90" y="900" width="95" height="40" class="box"/>
  <text x="137" y="927" text-anchor="middle" class="altText">alt</text>
  <text x="210" y="927" class="altText">Delete selected user</text>

  <rect x="522" y="980" width="16" height="205" class="active"/>
  <rect x="907" y="1025" width="16" height="205" class="active"/>
  <rect x="1317" y="1130" width="16" height="80" class="active"/>
  <rect x="1797" y="1170" width="16" height="42" class="active"/>

  <text x="305" y="975" text-anchor="middle" class="label">1. Clicks Delete User</text>
  <line x1="190" y1="995" x2="530" y2="995" class="line"/>

  <text x="722" y="1020" text-anchor="middle" class="label">2. deleteUserRequested(userId, username)</text>
  <line x1="530" y1="1040" x2="915" y2="1040" class="line"/>

  <text x="1105" y="1088" text-anchor="middle" class="label">3. Validate selected user</text>
  <path d="M 915 1098 L 1015 1098 L 1015 1138 L 915 1138" fill="none" class="line"/>

  <text x="1120" y="1150" text-anchor="middle" class="label">4. deleteUser(username)</text>
  <line x1="915" y1="1170" x2="1325" y2="1170" class="line"/>

  <text x="1565" y="1195" text-anchor="middle" class="label">5. DELETE FROM users WHERE name = username</text>
  <line x1="1325" y1="1215" x2="1805" y2="1215" class="line"/>

  <line x1="90" y1="1260" x2="2110" y2="1260" class="divider"/>
  <rect x="120" y="1244" width="150" height="27" class="bg"/>
  <text x="195" y="1264" text-anchor="middle" class="small" fill="#6c757d">success or error</text>
  <text x="120" y="1300" class="small" fill="#2f9e44">Success: AdminController reloads users, updates the list, clears the selected user form, and shows a green message.</text>
  <text x="120" y="1326" class="small" fill="#b94a48">Error: AdminController keeps the form visible and shows a red error message.</text>

  <!-- Add block -->
  <rect x="90" y="1400" width="2020" height="520" class="altBox"/>
  <rect x="90" y="1400" width="95" height="40" class="box"/>
  <text x="137" y="1427" text-anchor="middle" class="altText">alt</text>
  <text x="210" y="1427" class="altText">Add new user</text>

  <rect x="522" y="1480" width="16" height="265" class="active"/>
  <rect x="907" y="1585" width="16" height="250" class="active"/>
  <rect x="1317" y="1725" width="16" height="80" class="active"/>
  <rect x="1797" y="1765" width="16" height="42" class="active"/>

  <text x="300" y="1475" text-anchor="middle" class="label">1. Clicks Add User</text>
  <line x1="190" y1="1495" x2="530" y2="1495" class="line"/>

  <text x="720" y="1530" text-anchor="middle" class="label">2. showAddUserPage()</text>
  <path d="M 530 1540 L 630 1540 L 630 1580 L 530 1580" fill="none" class="line"/>

  <text x="330" y="1605" text-anchor="middle" class="label">3. Fills form and clicks Add</text>
  <line x1="190" y1="1625" x2="530" y2="1625" class="line"/>

  <text x="722" y="1650" text-anchor="middle" class="label">4. addUserRequested(user, passwordConfirmation)</text>
  <line x1="530" y1="1670" x2="915" y2="1670" class="line"/>

  <text x="1125" y="1715" text-anchor="middle" class="label">5. Validate username, password and confirmation</text>
  <path d="M 915 1725 L 1015 1725 L 1015 1765 L 915 1765" fill="none" class="line"/>

  <text x="1120" y="1780" text-anchor="middle" class="label">6. addUser(user)</text>
  <line x1="915" y1="1800" x2="1325" y2="1800" class="line"/>

  <text x="1565" y="1825" text-anchor="middle" class="label">7. INSERT INTO users</text>
  <line x1="1325" y1="1845" x2="1805" y2="1845" class="line"/>

  <line x1="90" y1="1888" x2="2110" y2="1888" class="divider"/>
  <rect x="120" y="1872" width="150" height="27" class="bg"/>
  <text x="195" y="1892" text-anchor="middle" class="small" fill="#6c757d">success or error</text>
  <text x="120" y="1930" class="small" fill="#2f9e44">Success: AdminController reloads users, updates the list, stays on the Add User form, and shows a green message.</text>
  <text x="120" y="1956" class="small" fill="#b94a48">Error: AdminController stays on the Add User form and shows a red error message.</text>
</svg>
