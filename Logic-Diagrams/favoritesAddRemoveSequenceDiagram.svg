<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2350" height="1800" viewBox="0 0 2350 1800">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f9e44"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b94a48"/>
    </marker>
    <style>
      .title { font: 700 46px Arial, sans-serif; fill: #111111; }
      .head { font: 700 22px Arial, sans-serif; fill: #13213b; }
      .label { font: 21px Arial, sans-serif; fill: #111111; }
      .small { font: 19px Arial, sans-serif; fill: #111111; }
      .altText { font: 700 22px Arial, sans-serif; fill: #13213b; }
      .box { fill: #ffffff; stroke: #13213b; stroke-width: 3; }
      .altBox { fill: none; stroke: #13213b; stroke-width: 3; }
      .note { fill: #fffdf2; stroke: #13213b; stroke-width: 2; }
      .life { stroke: #13213b; stroke-width: 3; stroke-dasharray: 16 13; }
      .active { fill: #eef4fb; stroke: #13213b; stroke-width: 1.5; }
      .line { stroke: #111111; stroke-width: 3; marker-end: url(#arrow); }
      .return { stroke: #111111; stroke-width: 2.5; stroke-dasharray: 12 8; marker-end: url(#arrow); }
      .greenLine { stroke: #2f9e44; stroke-width: 2.5; stroke-dasharray: 12 8; marker-end: url(#arrowGreen); }
      .redLine { stroke: #b94a48; stroke-width: 2.5; stroke-dasharray: 12 8; marker-end: url(#arrowRed); }
      .divider { stroke: #6c757d; stroke-width: 2; }
      .bg { fill: #ffffff; }
    </style>
  </defs>

  <rect width="2350" height="1800" fill="#ffffff"/>
  <text x="1175" y="62" text-anchor="middle" class="title">Favorites Add and Remove Flow</text>

  <!-- Participants -->
  <rect x="70" y="100" width="220" height="68" class="box"/>
  <text x="180" y="142" text-anchor="middle" class="head">User</text>

  <rect x="390" y="100" width="230" height="68" class="box"/>
  <text x="505" y="142" text-anchor="middle" class="head">StarView</text>

  <rect x="740" y="100" width="270" height="68" class="box"/>
  <text x="875" y="142" text-anchor="middle" class="head">StarController</text>

  <rect x="1135" y="100" width="260" height="68" class="box"/>
  <text x="1265" y="142" text-anchor="middle" class="head">AuthController</text>

  <rect x="1535" y="100" width="250" height="68" class="box"/>
  <text x="1660" y="142" text-anchor="middle" class="head">UserDatabase</text>

  <rect x="1945" y="100" width="290" height="68" class="box"/>
  <text x="2090" y="130" text-anchor="middle" class="head">SQLite favorites</text>
  <text x="2090" y="156" text-anchor="middle" class="head">table</text>

  <!-- Lifelines -->
  <line x1="180" y1="168" x2="180" y2="1735" class="life"/>
  <line x1="505" y1="168" x2="505" y2="1735" class="life"/>
  <line x1="875" y1="168" x2="875" y2="1735" class="life"/>
  <line x1="1265" y1="168" x2="1265" y2="1735" class="life"/>
  <line x1="1660" y1="168" x2="1660" y2="1735" class="life"/>
  <line x1="2090" y1="168" x2="2090" y2="1735" class="life"/>

  <!-- Starting point -->
  <rect x="90" y="205" width="2160" height="82" class="note"/>
  <text x="120" y="240" class="altText">Starting point</text>
  <text x="120" y="266" class="small">A logged-in user has selected a star. The sidebar shows Star Information and the favorite button state is based on userId + starId.</text>

  <!-- Shared state check -->
  <text x="342" y="340" text-anchor="middle" class="label">1. Star selected</text>
  <line x1="180" y1="360" x2="505" y2="360" class="line"/>

  <text x="690" y="405" text-anchor="middle" class="label">2. starSelected(starId)</text>
  <line x1="505" y1="425" x2="875" y2="425" class="line"/>

  <text x="1070" y="470" text-anchor="middle" class="label">3. isFavoriteForCurrentUser(starId)</text>
  <line x1="875" y1="490" x2="1265" y2="490" class="line"/>

  <text x="1462" y="535" text-anchor="middle" class="label">4. isFavorite(userId, starId)</text>
  <line x1="1265" y1="555" x2="1660" y2="555" class="line"/>

  <text x="1875" y="580" text-anchor="middle" class="label">5. SELECT favorite by IDs</text>
  <line x1="1660" y1="600" x2="2090" y2="600" class="line"/>

  <text x="1875" y="640" text-anchor="middle" class="label">6. Found or not found</text>
  <line x1="2090" y1="660" x2="1660" y2="660" class="return"/>

  <text x="1462" y="700" text-anchor="middle" class="label">7. true or false</text>
  <line x1="1660" y1="720" x2="1265" y2="720" class="return"/>

  <text x="1070" y="760" text-anchor="middle" class="label">8. Update button text</text>
  <line x1="1265" y1="780" x2="875" y2="780" class="return"/>

  <text x="690" y="820" text-anchor="middle" class="label">9. show Add Favorite or Remove Favorite</text>
  <line x1="875" y1="840" x2="505" y2="840" class="greenLine"/>

  <!-- Add block -->
  <rect x="90" y="900" width="2160" height="330" class="altBox"/>
  <rect x="90" y="900" width="95" height="40" class="box"/>
  <text x="137" y="927" text-anchor="middle" class="altText">alt</text>
  <text x="210" y="927" class="altText">Button says Add Favorite</text>

  <rect x="497" y="970" width="16" height="115" class="active"/>
  <rect x="867" y="1010" width="16" height="130" class="active"/>
  <rect x="1257" y="1048" width="16" height="92" class="active"/>
  <rect x="1652" y="1085" width="16" height="55" class="active"/>

  <text x="342" y="975" text-anchor="middle" class="label">10a. Clicks Add Favorite</text>
  <line x1="180" y1="995" x2="505" y2="995" class="line"/>

  <text x="690" y="1020" text-anchor="middle" class="label">11a. favoriteToggleRequested()</text>
  <line x1="505" y1="1040" x2="875" y2="1040" class="line"/>

  <text x="1070" y="1065" text-anchor="middle" class="label">12a. addFavoriteForCurrentUser(starId)</text>
  <line x1="875" y1="1085" x2="1265" y2="1085" class="line"/>

  <text x="1462" y="1110" text-anchor="middle" class="label">13a. addFavorite(userId, starId)</text>
  <line x1="1265" y1="1130" x2="1660" y2="1130" class="line"/>

  <text x="1875" y="1135" text-anchor="middle" class="label">14a. INSERT OR IGNORE</text>
  <line x1="1660" y1="1155" x2="2090" y2="1155" class="line"/>

  <text x="1875" y="1195" text-anchor="middle" class="label">15a. Success or failure</text>
  <line x1="2090" y1="1215" x2="1660" y2="1215" class="return"/>

  <line x1="90" y1="1255" x2="2250" y2="1255" class="divider"/>
  <text x="1070" y="1292" text-anchor="middle" class="label" fill="#2f9e44">16a. Refresh current user's favorites and update button to Remove Favorite</text>
  <line x1="1265" y1="1312" x2="875" y2="1312" class="greenLine"/>

  <!-- Remove block -->
  <rect x="90" y="1370" width="2160" height="360" class="altBox"/>
  <rect x="90" y="1370" width="95" height="40" class="box"/>
  <text x="137" y="1397" text-anchor="middle" class="altText">alt</text>
  <text x="210" y="1397" class="altText">Button says Remove Favorite</text>

  <rect x="497" y="1440" width="16" height="120" class="active"/>
  <rect x="867" y="1475" width="16" height="150" class="active"/>
  <rect x="1257" y="1505" width="16" height="120" class="active"/>
  <rect x="1652" y="1530" width="16" height="85" class="active"/>
  <rect x="2082" y="1575" width="16" height="45" class="active"/>

  <text x="352" y="1445" text-anchor="middle" class="label">10b. Clicks Remove Favorite</text>
  <line x1="180" y1="1465" x2="505" y2="1465" class="line"/>

  <text x="690" y="1490" text-anchor="middle" class="label">11b. favoriteToggleRequested()</text>
  <line x1="505" y1="1510" x2="875" y2="1510" class="line"/>

  <text x="1070" y="1535" text-anchor="middle" class="label">12b. removeFavoriteForCurrentUser(starId)</text>
  <line x1="875" y1="1555" x2="1265" y2="1555" class="line"/>

  <text x="1462" y="1580" text-anchor="middle" class="label">13b. removeFavorite(userId, starId)</text>
  <line x1="1265" y1="1600" x2="1660" y2="1600" class="line"/>

  <text x="1875" y="1625" text-anchor="middle" class="label">14b. DELETE WHERE userId and starId</text>
  <line x1="1660" y1="1645" x2="2090" y2="1645" class="line"/>

  <text x="1875" y="1685" text-anchor="middle" class="label">15b. Success or failure</text>
  <line x1="2090" y1="1705" x2="1660" y2="1705" class="return"/>

  <text x="1070" y="1750" text-anchor="middle" class="label" fill="#2f9e44">16b. Refresh current user's favorites and update button to Add Favorite</text>
  <line x1="1265" y1="1770" x2="875" y2="1770" class="greenLine"/>
</svg>
